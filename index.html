<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    input {
      font-size: 1rem;
      padding: 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-right: 0.5rem;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #mensaje { margin-top: 1rem; min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>¡Hola, Mundo! 👋</h1>
  <p>Mi primera aplicación hecha con Claude Code y GitHub.</p>
  <div>
    <input id="nombre" type="text" placeholder="Escribe tu nombre">
    <button id="boton">Saludar</button>
  </div>
  <p id="mensaje"></p>

  <script>
    let clics = 0;
    const campoNombre = document.getElementById('nombre');

    function saludar() {
      clics++;
      const nombre = campoNombre.value.trim() || 'desconocido';
      document.getElementById('mensaje').textContent =
        `¡Hola, ${nombre}! Has pulsado el botón ${clics} ${clics === 1 ? 'vez' : 'veces'}.`;
    }

    document.getElementById('boton').addEventListener('click', saludar);
    // También saluda al pulsar Intro dentro de la casilla
    campoNombre.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saludar();
    });
  </script>
</body>
</html>
